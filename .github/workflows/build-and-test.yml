name: Build and Test

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Python compile
      run: |
        cd src
        python -m py_compile *.py
        echo "✓ All Python files compiled successfully"

    - name: Test imports
      run: |
        cd src
        python -c "from config import Config; from snmp_collector import SnmpCollector; from pdf_generator import PdfGenerator; from os_printer import OsPrinter; from notification import Notifier; print('✓ All imports successful')"

    - name: Test configuration
      run: |
        cd src
        python -c "
        import os
        os.environ['PRINTER_IP'] = '192.168.1.100'
        os.environ['NTFY_CHANNEL'] = 'test-channel'
        from config import Config
        config = Config()
        assert config.validate(), 'Config validation failed'
        print('✓ Configuration test passed')
        "

    - name: Test PDF generation
      run: |
        cd src
        python -c "
        import os
        from pdf_generator import PdfGenerator
        pdfGen = PdfGenerator('/tmp/test.pdf')
        printerInfo = {
            'model_name': 'HP Smart Tank 7005',
            'device_description': 'Test Device',
            'printer_name': 'Test Printer',
            'serial_number': 'TEST123',
            'pages_printed': '100',
            'ip_address': '192.168.1.100',
            'network_status': 'Connected',
            'uptime': '5d 3h 20m',
            'ink_levels': {
                'cyan': '85%',
                'magenta': '90%',
                'yellow': '75%',
                'black': '80%'
            }
        }
        result = pdfGen.generate_test_page(printerInfo)
        assert os.path.exists(result), 'PDF file was not created'
        print('✓ PDF generation test passed')
        "

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-pdf-${{ matrix.python-version }}
        path: /tmp/test.pdf
        if-no-files-found: ignore

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image for ARM64
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm64
        push: false
        tags: |
          ghcr.io/${{ github.repository_owner }}/printer-moisturiser:test
          ghcr.io/${{ github.repository_owner }}/printer-moisturiser:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Docker image for AMD64 (for testing)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: printer-moisturiser:test-amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
